name: Apex AI Windows installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-ai-release-windows
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build and publish Windows 0.3.6.6
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build self-contained ACC collector
        shell: pwsh
        run: |
          dotnet publish collector/ApexCollector.csproj -c Release -r win-x64 --self-contained true -o collector/publish -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw "Failed building C# collector" }
          if (-not (Test-Path collector/publish/ApexCollector.exe)) { throw "Collector executable missing" }
      - name: Test pit stop recorder transitions
        run: dotnet run --project collector.tests/RaceCaptureTests.csproj -c Release
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test ACC stint lifecycle on Windows
        shell: pwsh
        run: ./collector.tests/collector-lifecycle.ps1 -Collector ./collector/publish/ApexCollector.exe -TestDirectory (Join-Path $env:RUNNER_TEMP 'apex-lifecycle')
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify desktop entry and archive dashboard
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check ui/app.js
          node --check ui/analysis.js
          node --check ui/sampling.js
          node --check preferences.cjs
          node --check session-library.cjs
          node --check race-library.cjs
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Desktop tests failed" }
          node -e "const f=require('node:fs');if(!f.existsSync('../archive/0.2.15/index.html'))throw Error('Missing dashboard');if(!f.existsSync('collector/publish/ApexCollector.exe'))throw Error('Missing collector');console.log('Collector and dashboard ready');"
          if ($LASTEXITCODE -ne 0) { throw "Desktop source validation failed" }
      - name: Prepare six offline CC0 wallpapers (1920x1080)
        shell: pwsh
        run: |
          ./scripts/prepare-wallpapers.ps1
          Add-Type -AssemblyName System.Drawing
          foreach ($id in @("gt3", "gt3b", "wec", "wecb", "f1", "f1b")) {
            $file = "ui/wallpapers/$id.jpg"
            if (-not (Test-Path $file)) { throw "Missing wallpaper: $file" }
            $img = [System.Drawing.Image]::FromFile((Resolve-Path $file))
            try {
              if ($img.Width -ne 1920 -or $img.Height -ne 1080) {
                throw "Wrong wallpaper dimensions: $file"
              }
            } finally { $img.Dispose() }
          }
      - name: Build Windows setup with updater metadata
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Ensure auto-update manifest exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            # electron-builder 26 can skip upload metadata when --publish never.
            # Generate the same sha512/size keys from the verified NSIS installer.
            $setup = "dist/ApexAI-Setup-0.3.6.6-x64.exe"
            if (-not (Test-Path $setup)) { throw "Installer missing" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $setup))
            $hash = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData($bytes))
            $size = $bytes.LongLength
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            $text = @"
          version: 0.3.9
          files:
            - url: ApexAI-Setup-0.3.6.6-x64.exe
              sha512: $hash
              size: $size
          path: ApexAI-Setup-0.3.6.6-x64.exe
          sha512: $hash
          releaseDate: $date
          "@
            Set-Content -Path "dist/latest.yml" -Value $text -Encoding utf8
          }
      - name: Verify installers, collector and latest.yml
        shell: pwsh
        run: |
          $expected = @(
            "dist/ApexAI-Setup-0.3.6.6-x64.exe",
            "dist/ApexAI-Portable-0.3.6.6-x64.exe",
            "dist/latest.yml"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            Write-Output "Verified $file"
          }
          if ((Get-Item "dist/ApexAI-Setup-0.3.6.6-x64.exe").Length -lt 10000000) {
            throw "Installer unexpectedly small"
          }
          $manifest = Get-Content "dist/latest.yml" -Raw
          if ($manifest -notmatch "ApexAI-Setup-0.3.6.6-x64.exe" -or $manifest -notmatch "sha512:") {
            throw "latest.yml is missing installer or hash"
          }
          $unpacked = "dist/win-unpacked/resources"
          if (-not (Test-Path "$unpacked/collector/ApexCollector.exe")) { throw "Collector not included in packaged app" }
          foreach ($ui in @("index.html", "app.js", "analysis.js", "sampling.js", "style.css")) {
            if (-not (Test-Path "$unpacked/ui/$ui")) { throw "Missing redesigned UI resource: $ui" }
          }
          foreach ($id in @("gt3", "gt3b", "wec", "wecb", "f1", "f1b")) {
            $asset = "$unpacked/ui/wallpapers/$id.jpg"
            if (-not (Test-Path $asset)) { throw "Offline CC0 wallpaper missing in installer: $asset" }
          }
          if (-not (Test-Path "$unpacked/ui/wallpapers/credits.json")) { throw "Missing CC0 wallpaper credits" }
          if (-not (Test-Path "$unpacked/app-update.yml")) { throw "Auto-updater config missing" }
          if (-not (Test-Path "dist/win-unpacked/resources/app.asar")) { throw "Packaged application missing" }
          node -e "const fs=require('node:fs');const p=require('./package.json');if(!p.build.files.includes('race-library.cjs'))throw Error('Missing race archive packaging');"
      - name: Publish setup and auto-update manifest on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v0.3.6.6"
          $files = @(
            "dist/ApexAI-Setup-0.3.6.6-x64.exe",
            "dist/ApexAI-Portable-0.3.6.6-x64.exe",
            "dist/latest.yml"
          )
          $files += @(Get-ChildItem "dist/*.blockmap" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --repo $repo --clobber
          } else {
            gh release create $tag @files --repo $repo --target $env:GITHUB_SHA --latest --title "Apex AI 0.3.6.6 — Windows" --notes "Poprawka odczytu pit lane, stintów i kar w ACC."
          }
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release not published" }
          gh release view $tag --repo $repo --json url,assets
          if ($LASTEXITCODE -ne 0) { throw "Release verification failed" }
      - name: Backup binaries and updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: ApexAI-Windows-0.3.6.6
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
