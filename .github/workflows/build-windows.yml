name: Apex AI Windows installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "archive/0.2.15/index.html"
      - "index.html"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Build and publish Windows installer 0.3.0
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install packaging tools
        run: npm install --no-audit --no-fund
      - name: Verify dashboard and app entry
        run: |
          node --check main.cjs
          node -e "const fs=require('node:fs');const p='../archive/0.2.15/index.html';if(!fs.existsSync(p))throw Error('Missing legacy dashboard');console.log('Application dashboard ready');"
      - name: Build Windows installer and portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer files
        shell: pwsh
        run: |
          $files = @("dist/ApexAI-Setup-0.3.0-x64.exe", "dist/ApexAI-Portable-0.3.0-x64.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Expected installer is missing: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 10000000) { throw "Installer is unexpectedly small: $file ($size bytes)" }
            Write-Output "Verified $file ($size bytes)"
          }
      - name: Publish direct-download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0"
          $repo = $env:GITHUB_REPOSITORY
          $setup = "dist/ApexAI-Setup-0.3.0-x64.exe"
          $portable = "dist/ApexAI-Portable-0.3.0-x64.exe"
          gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable --repo $repo --clobber
          } else {
            gh release create $tag $setup $portable --repo $repo --target $env:GITHUB_SHA --title "Apex AI 0.3.0 — Windows" --notes "Instalator Windows 10/11 x64: ApexAI-Setup-0.3.0-x64.exe. Pobierz i uruchom, zainstaluj aplikację. Wersja 0.3.0 ma ręczny import telemetrii ACC, a zintegrowany rejestrator jest zaplanowany na 0.3.1."
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
          gh release view $tag --repo $repo --json url,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not verify published release." }
      - name: Keep CI artifacts as backup
        uses: actions/upload-artifact@v4
        with:
          name: ApexAI-Windows-0.3.0
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
